<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>IlmStation Puzzle</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#faf6ee;color:#1c1a17;font-family:"Baloo Bhaijaan 2",system-ui,sans-serif;user-select:none;-webkit-user-select:none;overflow:hidden}
  #app{height:100%;display:flex;flex-direction:column;align-items:center;padding:12px;gap:10px}
  .top{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .pill{border:2px solid #1c1a17;background:#fff;padding:3px 12px;font-weight:800;font-size:17px;box-shadow:3px 3px 0 #1c1a17;white-space:nowrap}
  h1{font-size:24px;line-height:1.1;text-align:center}
  #sub{font-size:15px;color:#6b6257;text-align:center;margin-top:-6px}
  #board{position:relative;width:min(92vw,62vh,500px);aspect-ratio:1;border:3px solid #1c1a17;box-shadow:6px 6px 0 #1c1a17;background:#1c1a17;touch-action:none}
  .tile{position:absolute;background-repeat:no-repeat;border:1.5px solid rgba(28,26,23,.55);transition:left .2s,top .2s,transform .12s;cursor:pointer}
  .tile.sel{outline:4px solid #f0c23c;outline-offset:-4px;transform:scale(.96);z-index:2}
  .tile.ok{border-color:rgba(255,255,255,.15)}
  #peek{position:absolute;inset:0;background-size:100% 100%;opacity:0;pointer-events:none;transition:opacity .25s}
  #peek.on{opacity:1}
  .row{display:flex;gap:10px}
  button{font-family:inherit;font-weight:800;font-size:18px;border:2px solid #1c1a17;background:#f0c23c;padding:8px 18px;box-shadow:3px 3px 0 #1c1a17;cursor:pointer;color:#1c1a17}
  button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #1c1a17}
  button.light{background:#fff}
  #win{position:fixed;inset:0;background:rgba(250,246,238,.92);display:none;align-items:center;justify-content:center;padding:20px}
  #win.on{display:flex}
  .card{max-width:420px;width:100%;border:3px solid #1c1a17;background:#fff;box-shadow:6px 6px 0 #1c1a17;padding:20px;text-align:center}
  .card img{width:60%;border:2px solid #1c1a17;margin:8px auto;display:block}
  .stars{font-size:44px;letter-spacing:4px}
  .stars .off{filter:grayscale(1);opacity:.3}
  .card p{font-size:17px;line-height:1.4;margin:6px 0 14px}
</style>
</head>
<body>
<div id="app">
  <div class="top"><span class="pill" id="moves">👆 0</span><span class="pill" id="lvl">⭐</span></div>
  <h1 id="title">Puzzle</h1>
  <div id="sub">Tap two pieces to swap them</div>
  <div id="board"><div id="peek"></div></div>
  <div class="row"><button class="light" id="peekBtn">👀 Peek</button><button class="light" id="mixBtn">🔀 Mix</button></div>
</div>
<div id="win"><div class="card"><div class="stars" id="stars"></div><h1 id="wTitle"></h1><img id="wImg" alt=""><p id="wFact"></p><button id="again">↻ Again</button></div></div>
<script>
(() => {
const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search);
let LANG = (Q.get('lang') || 'en').slice(0, 2);

/* ---------------- pictures (SVG, drawn in code) ---------------- */
const sky = (a, b) => `<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="600" height="600" fill="url(#g)"/>`;
const minaret = (x, h, c = '#f7f1e3', cap = '#2e8b57') => `<rect x="${x - 12}" y="${470 - h}" width="24" height="${h}" fill="${c}"/><rect x="${x - 18}" y="${470 - h * 0.7}" width="36" height="10" fill="${c}"/><polygon points="${x - 14},${470 - h} ${x + 14},${470 - h} ${x},${430 - h}" fill="${cap}"/>`;
const palm = (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-6 0 Q0 -60 6 -120 L14 -120 Q8 -60 6 0Z" fill="#8a5a2b"/><g fill="#2f8a3e"><path d="M10 -120 Q60 -150 95 -110 Q55 -125 10 -115Z"/><path d="M10 -120 Q-40 -155 -80 -115 Q-35 -128 10 -115Z"/><path d="M10 -122 Q40 -175 80 -170 Q40 -150 12 -118Z"/><path d="M10 -122 Q-15 -180 -55 -175 Q-15 -150 8 -118Z"/></g><g fill="#7a3e1a"><circle cx="4" cy="-108" r="7"/><circle cx="16" cy="-106" r="7"/><circle cx="10" cy="-98" r="7"/></g></g>`;
const stars = n => Array.from({ length: n }, (_, i) => `<circle cx="${(i * 137) % 600}" cy="${(i * 71) % 300}" r="${2 + (i % 3)}" fill="#fff8d6"/>`).join('');
const letterPic = (ch, bg, fg, emoji, word) => `${sky(bg[0], bg[1])}<circle cx="300" cy="260" r="200" fill="#fff" opacity=".9"/><text x="300" y="350" font-size="300" text-anchor="middle" font-family="Baloo Bhaijaan 2, Noto Naskh Arabic, Tahoma, sans-serif" font-weight="800" fill="${fg}">${ch}</text><text x="160" y="560" font-size="90" text-anchor="middle">${emoji}</text><text x="380" y="560" font-size="70" text-anchor="middle" font-family="Baloo Bhaijaan 2, Tahoma, sans-serif" font-weight="800" fill="#1c1a17">${word}</text>`;
const PICS = {
  kaaba: `${sky('#bfe3f2', '#fdf2d6')}<rect y="430" width="600" height="170" fill="#e9e3d6"/><ellipse cx="300" cy="470" rx="270" ry="60" fill="#f7f4ee"/>${minaret(60, 260, '#f7f4ee', '#c9b48a')}${minaret(540, 260, '#f7f4ee', '#c9b48a')}<polygon points="190,250 410,250 450,300 450,470 150,470 150,300" fill="#1c1a17"/><polygon points="150,300 450,300 410,250 190,250" fill="#2b2b2b"/><rect x="150" y="320" width="300" height="26" fill="#e3b54a"/><rect x="360" y="380" width="44" height="90" fill="#e3b54a"/>`,
  nabawi: `${sky('#9fd3ef', '#fdf2d6')}<rect y="470" width="600" height="130" fill="#efe5cf"/><rect x="110" y="330" width="380" height="140" fill="#f7f1e3"/><g fill="#d9c9a3">${[150, 210, 270, 330, 390, 450].map(x => `<rect x="${x - 15}" y="380" width="30" height="60" rx="15"/>`).join('')}</g><rect x="250" y="250" width="100" height="80" fill="#f7f1e3"/><path d="M230 255 Q300 120 370 255Z" fill="#2e8b57"/><rect x="296" y="120" width="8" height="40" fill="#e3b54a"/>${minaret(80, 300)}${minaret(520, 300)}${palm(40, 590, .9)}${palm(560, 590, .9)}`,
  aqsa: `${sky('#b9dcf0', '#f6efe2')}<rect y="470" width="600" height="130" fill="#d9cdb4"/><rect x="90" y="320" width="420" height="150" fill="#e8dcc2"/><g fill="#7c6a4e">${[140, 200, 260, 340, 400, 460].map(x => `<rect x="${x - 16}" y="370" width="32" height="70" rx="16"/>`).join('')}</g><rect x="240" y="250" width="120" height="70" fill="#e8dcc2"/><path d="M225 255 Q300 140 375 255Z" fill="#8d99ae"/><rect x="296" y="150" width="8" height="30" fill="#5c677d"/>${minaret(540, 260, '#e8dcc2', '#8d99ae')}<g fill="#3d6b3a"><path d="M40 470 Q55 330 70 470Z"/><path d="M490 470 Q505 360 520 470Z"/></g>`,
  quba: `${sky('#a8dcf0', '#fff6dc')}<rect y="460" width="600" height="140" fill="#efe2c4"/><rect x="120" y="320" width="360" height="140" fill="#ffffff"/>${[200, 300, 400].map(x => `<path d="M${x - 45} 325 Q${x} 240 ${x + 45} 325Z" fill="#ffffff" stroke="#e8e0cf" stroke-width="3"/>`).join('')}<g fill="#cfc7b4">${[170, 230, 290, 350, 410].map(x => `<rect x="${x - 14}" y="380" width="28" height="55" rx="14"/>`).join('')}</g>${minaret(80, 280, '#ffffff', '#ffffff')}${minaret(520, 280, '#ffffff', '#ffffff')}${palm(40, 600, 1)}${palm(570, 600, .8)}`,
  night: `${sky('#14213d', '#3a3f7a')}${stars(40)}<path d="M470 110 a70 70 0 1 0 50 120 a55 55 0 1 1 -50 -120Z" fill="#ffe08a"/><rect y="470" width="600" height="130" fill="#2a2f5a"/><rect x="170" y="340" width="260" height="130" fill="#e9dfc7"/><path d="M220 345 Q300 230 380 345Z" fill="#2e8b57"/>${minaret(130, 260, '#e9dfc7')}${minaret(470, 260, '#e9dfc7')}<g fill="#ffd166">${[220, 270, 330, 380].map(x => `<rect x="${x - 10}" y="390" width="20" height="40" rx="10"/>`).join('')}</g>`,
  ba: letterPic('ب', ['#ffd6a5', '#ffadad'], '#c1121f', '🏠', 'بيت'),
  ta: letterPic('ت', ['#caffbf', '#9bf6ff'], '#1d6f65', '🌴', 'تمر'),
  jeem: letterPic('ج', ['#fdffb6', '#ffd6a5'], '#8a5a2b', '🐪', 'جمل'),
  seen: letterPic('س', ['#a0c4ff', '#bdb2ff'], '#3f37c9', '🐟', 'سمك'),
  meem: letterPic('م', ['#ffc6ff', '#ffadad'], '#7b2cbf', '🕌', 'مسجد'),
  camel: `${sky('#ffb347', '#ffe6a7')}<circle cx="450" cy="200" r="70" fill="#fff3b0"/><path d="M0 470 Q150 380 300 450 T600 430 V600 H0Z" fill="#e0a85c"/><path d="M0 520 Q200 460 400 520 T600 500 V600 H0Z" fill="#c98b45"/><g fill="#a86a2d"><ellipse cx="260" cy="380" rx="90" ry="45"/><ellipse cx="240" cy="335" rx="40" ry="35"/><rect x="190" y="400" width="14" height="80"/><rect x="225" y="400" width="14" height="80"/><rect x="290" y="400" width="14" height="80"/><rect x="320" y="400" width="14" height="80"/><path d="M330 370 Q380 330 370 280 L392 280 Q402 340 345 392Z"/><ellipse cx="392" cy="275" rx="26" ry="16"/></g><circle cx="400" cy="270" r="4" fill="#1c1a17"/>${palm(80, 470, .9)}`,
  palm: `${sky('#bfe9ff', '#f2fbe3')}<rect y="480" width="600" height="120" fill="#a7d47a"/><circle cx="110" cy="110" r="50" fill="#ffe08a"/>${palm(300, 560, 2.6)}<g fill="#7a3e1a">${[0, 1, 2, 3, 4].map(i => `<circle cx="${180 + i * 50}" cy="560" r="12"/>`).join('')}</g>`,
  moon: `${sky('#0b132b', '#2d3a74')}${stars(60)}<circle cx="300" cy="250" r="140" fill="#fff3c4"/><circle cx="250" cy="210" r="22" fill="#efe2a8"/><circle cx="345" cy="300" r="30" fill="#efe2a8"/><circle cx="330" cy="200" r="12" fill="#efe2a8"/><path d="M0 500 Q150 440 300 500 T600 480 V600 H0Z" fill="#1d2550"/>`,
  sea: `${sky('#9fdcff', '#d7f3ff')}<rect y="260" width="600" height="340" fill="#2a8fd4"/><path d="M0 260 Q75 240 150 260 T300 260 T450 260 T600 260 V280 H0Z" fill="#60b8ef"/><g fill="#405a8c"><ellipse cx="330" cy="420" rx="150" ry="70"/><path d="M470 420 L560 360 L545 420 L560 480Z"/></g><circle cx="230" cy="405" r="8" fill="#fff"/><g fill="#ffb703"><ellipse cx="120" cy="330" rx="30" ry="16"/><polygon points="148,330 170,316 170,344"/></g><g fill="#fb8500"><ellipse cx="160" cy="520" rx="26" ry="14"/><polygon points="184,520 204,508 204,532"/></g><path d="M180 190 L240 190 L230 220 L190 220Z" fill="#8a5a2b"/><rect x="208" y="120" width="5" height="70" fill="#5a3a1a"/><polygon points="213,125 255,175 213,175" fill="#fff"/>`,
  rainbow: `${sky('#bde0fe', '#e8f6ff')}${['#e63946', '#f4a261', '#ffd166', '#52b788', '#3f72af', '#7b5ea7'].map((c, i) => `<path d="M${60 + i * 22} 460 A${240 - i * 22} ${240 - i * 22} 0 0 1 ${540 - i * 22} 460" stroke="${c}" stroke-width="22" fill="none"/>`).join('')}<path d="M0 470 L150 300 L260 430 L370 260 L600 470 V600 H0Z" fill="#6b8f71"/><path d="M370 260 L410 310 L330 310Z" fill="#fff"/><rect y="500" width="600" height="100" fill="#8cc56a"/>`,
};

/* ---------------- packs (subject → 5 levels) ---------------- */
const L = (en, ar, id, tl) => ({ en, ar, id, tl });
const PACKS = {
  places: { name: L('Holy Places', 'الأماكن المقدسة', 'Tempat Suci', 'Mga Banal na Lugar'), levels: [
    ['kaaba', L('The Kaaba', 'الكعبة', "Ka'bah", 'Ang Kaaba'), L('The Kaaba is in Makkah. Muslims all over the world face it when they pray.', 'الكعبة في مكة، ويتّجه إليها المسلمون في صلاتهم في كل العالم.', "Ka'bah ada di Makkah. Muslim di seluruh dunia menghadapnya saat shalat.", 'Ang Kaaba ay nasa Makkah. Dito nakaharap ang mga Muslim sa buong mundo kapag nagdarasal.')],
    ['quba', L('Masjid Quba', 'مسجد قباء', 'Masjid Quba', 'Masjid Quba'), L('Masjid Quba was the first masjid built in Islam.', 'مسجد قباء أول مسجد بُني في الإسلام.', 'Masjid Quba adalah masjid pertama yang dibangun dalam Islam.', 'Ang Masjid Quba ang unang masjid na itinayo sa Islam.')],
    ['nabawi', L('Masjid an-Nabawi', 'المسجد النبوي', 'Masjid Nabawi', 'Masjid an-Nabawi'), L('The Prophet ﷺ built this masjid in Madinah with his companions.', 'بنى النبي ﷺ هذا المسجد في المدينة مع أصحابه.', 'Nabi ﷺ membangun masjid ini di Madinah bersama para sahabat.', 'Itinayo ng Propeta ﷺ ang masjid na ito sa Madinah kasama ng kanyang mga kasamahan.')],
    ['aqsa', L('Masjid al-Aqsa', 'المسجد الأقصى', 'Masjidil Aqsa', 'Masjid al-Aqsa'), L('Masjid al-Aqsa is in Al-Quds. It was the first qibla.', 'المسجد الأقصى في القدس، وكان أول قبلة.', 'Masjidil Aqsa ada di Al-Quds. Itu kiblat pertama.', 'Ang Masjid al-Aqsa ay nasa Al-Quds. Ito ang unang qibla.')],
    ['night', L('Masjid at Night', 'المسجد في الليل', 'Masjid di Malam Hari', 'Masjid sa Gabi'), L('Muslims pray Isha at night, then sleep and wake up for Fajr.', 'يصلّي المسلمون العشاء في الليل، ثم ينامون ويستيقظون للفجر.', 'Muslim shalat Isya di malam hari, lalu tidur dan bangun untuk Subuh.', 'Nagdarasal ng Isha ang mga Muslim sa gabi, saka natutulog at gumigising para sa Fajr.')],
  ] },
  letters: { name: L('Arabic Letters', 'الحروف العربية', 'Huruf Arab', 'Mga Titik Arabe'), levels: [
    ['ba', L('Baa: بيت (house)', 'باء: بيت', 'Ba: بيت (rumah)', 'Baa: بيت (bahay)'), L('ب has one dot under it.', 'الباء لها نقطة واحدة تحتها.', 'ب punya satu titik di bawah.', 'Ang ب ay may isang tuldok sa ilalim.')],
    ['ta', L('Taa: تمر (dates)', 'تاء: تمر', 'Ta: تمر (kurma)', 'Taa: تمر (datiles)'), L('ت has two dots on top.', 'التاء لها نقطتان فوقها.', 'ت punya dua titik di atas.', 'Ang ت ay may dalawang tuldok sa itaas.')],
    ['jeem', L('Jeem: جمل (camel)', 'جيم: جمل', 'Jim: جمل (unta)', 'Jeem: جمل (kamelyo)'), L('ج has one dot inside its curve.', 'الجيم لها نقطة في بطنها.', 'ج punya satu titik di dalam lengkungannya.', 'Ang ج ay may isang tuldok sa loob ng kurba nito.')],
    ['seen', L('Seen: سمك (fish)', 'سين: سمك', 'Sin: سمك (ikan)', 'Seen: سمك (isda)'), L('س has three little teeth and no dots.', 'السين لها ثلاث أسنان صغيرة بلا نقاط.', 'س punya tiga gigi kecil tanpa titik.', 'Ang س ay may tatlong maliit na ngipin at walang tuldok.')],
    ['meem', L('Meem: مسجد (masjid)', 'ميم: مسجد', 'Mim: مسجد (masjid)', 'Meem: مسجد (masjid)'), L('م has a round head and a tail.', 'الميم لها رأس مستدير وذيل.', 'م punya kepala bulat dan ekor.', 'Ang م ay may bilog na ulo at buntot.')],
  ] },
  creation: { name: L("Allah's Creation", 'من خلق الله', 'Ciptaan Allah', 'Nilikha ng Allah'), levels: [
    ['camel', L('The Camel', 'الجمل', 'Unta', 'Ang Kamelyo'), L('Allah made the camel strong. It can walk in the desert for days without water!', 'خلق الله الجمل قويًا، يمشي في الصحراء أيامًا بلا ماء!', 'Allah menciptakan unta yang kuat. Ia bisa berjalan di gurun berhari-hari tanpa air!', 'Ginawa ng Allah na malakas ang kamelyo. Kaya nitong maglakad sa disyerto nang ilang araw nang walang tubig!')],
    ['palm', L('The Date Palm', 'النخلة', 'Pohon Kurma', 'Ang Puno ng Datiles'), L('The date palm gives us sweet dates. The Prophet ﷺ loved dates.', 'النخلة تعطينا التمر الحلو، وكان النبي ﷺ يحب التمر.', 'Pohon kurma memberi kita kurma yang manis. Nabi ﷺ suka kurma.', 'Nagbibigay sa atin ng matamis na datiles ang puno nito. Mahal ng Propeta ﷺ ang datiles.')],
    ['moon', L('The Moon', 'القمر', 'Bulan', 'Ang Buwan'), L('We look at the new moon to know when Ramadan and Eid begin.', 'ننظر إلى الهلال لنعرف بداية رمضان والعيد.', 'Kita melihat hilal untuk tahu kapan Ramadhan dan hari raya dimulai.', 'Tinitingnan natin ang bagong buwan para malaman kung kailan magsisimula ang Ramadan at Eid.')],
    ['sea', L('The Sea', 'البحر', 'Laut', 'Ang Dagat'), L('Allah made the big sea full of fish. Prophet Yunus was saved from inside a big fish.', 'خلق الله البحر الكبير مليئًا بالأسماك، ونجّى نبيَّه يونس من بطن الحوت.', 'Allah menciptakan laut yang luas penuh ikan. Nabi Yunus diselamatkan dari dalam ikan besar.', 'Ginawa ng Allah ang malawak na dagat na puno ng isda. Iniligtas si Propeta Yunus mula sa loob ng malaking isda.')],
    ['rainbow', L('Mountains and Rainbow', 'الجبال وقوس المطر', 'Gunung dan Pelangi', 'Bundok at Bahaghari'), L('Allah made mountains strong and colours beautiful. SubhanAllah!', 'خلق الله الجبال قوية والألوان جميلة. سبحان الله!', 'Allah menciptakan gunung yang kokoh dan warna yang indah. Subhanallah!', 'Ginawa ng Allah na matibay ang bundok at maganda ang mga kulay. SubhanAllah!')],
  ] },
};
const GRIDS = [[2, 2], [3, 2], [3, 3], [3, 4], [4, 4]];
const UI = {
  hint: L('Tap two pieces to swap them', 'اضغط على قطعتين لتبدّل مكانهما', 'Ketuk dua keping untuk menukarnya', 'I-tap ang dalawang piraso para pagpalitin'),
  peek: L('👀 Peek', '👀 انظر', '👀 Intip', '👀 Silipin'), mix: L('🔀 Mix', '🔀 اخلط', '🔀 Acak', '🔀 Haluin'),
  again: L('↻ Again', '↻ مرة أخرى', '↻ Ulangi', '↻ Ulitin'), level: L('Level', 'المرحلة', 'Level', 'Level'),
  done: L('MashaAllah!', 'ما شاء الله!', 'MasyaAllah!', 'MashaAllah!'),
};
const tr = o => o[LANG] || o.en;

const pack = PACKS[Q.get('s')] || PACKS.places;
const lvIdx = Math.max(0, Math.min(4, (parseInt(Q.get('l'), 10) || 1) - 1));
const [picId, titleO, factO] = pack.levels[lvIdx];
const [COLS, ROWS] = GRIDS[lvIdx];
const N = COLS * ROWS;
const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">${PICS[picId]}</svg>`;
const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);

let order = [], sel = null, moves = 0, solved = false;
const board = $('board'), tiles = [];
function shuffle() {
  do { order = [...Array(N).keys()].sort(() => Math.random() - 0.5); } while (order.every((v, i) => v === i));
}
function build() {
  tiles.forEach(t => t.remove()); tiles.length = 0;
  for (let k = 0; k < N; k++) {
    const t = document.createElement('div'); t.className = 'tile';
    const c = k % COLS, r = Math.floor(k / COLS);
    t.style.backgroundImage = `url("${url}")`;
    t.style.backgroundSize = `${COLS * 100}% ${ROWS * 100}%`;
    t.style.backgroundPosition = `${COLS > 1 ? c / (COLS - 1) * 100 : 0}% ${ROWS > 1 ? r / (ROWS - 1) * 100 : 0}%`;
    t.style.width = `${100 / COLS}%`; t.style.height = `${100 / ROWS}%`;
    t.dataset.piece = k;
    t.onclick = () => tap(t);
    board.appendChild(t); tiles.push(t);
  }
  place();
}
function place() {
  order.forEach((piece, slot) => {
    const t = tiles[piece];
    t.style.left = `${(slot % COLS) * 100 / COLS}%`; t.style.top = `${Math.floor(slot / COLS) * 100 / ROWS}%`;
    t.classList.toggle('ok', piece === slot);
  });
}
function beep(f, d = 0.1) { try { const a = beep.ctx || (beep.ctx = new (window.AudioContext || window.webkitAudioContext)()); const o = a.createOscillator(), g = a.createGain(); o.frequency.value = f; g.gain.setValueAtTime(0.12, a.currentTime); g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + d); o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + d); } catch (e) {} }
function tap(t) {
  if (solved) return;
  const piece = +t.dataset.piece;
  if (sel === null) { sel = piece; t.classList.add('sel'); beep(600); return; }
  tiles[sel].classList.remove('sel');
  if (sel !== piece) {
    const a = order.indexOf(sel), b = order.indexOf(piece);
    [order[a], order[b]] = [order[b], order[a]];
    moves++; $('moves').textContent = `👆 ${moves}`;
    place(); beep(order[b] === b || order[a] === a ? 880 : 500);
    if (order.every((v, i) => v === i)) win();
  }
  sel = null;
}
function win() {
  solved = true;
  const par = Math.ceil(N * 0.9);
  const nStars = moves <= par ? 3 : moves <= par * 1.8 ? 2 : 1;
  [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.25), i * 130));
  setTimeout(() => {
    $('stars').innerHTML = [0, 1, 2].map(i => `<span class="${i < nStars ? '' : 'off'}">⭐</span>`).join('');
    $('wTitle').textContent = tr(UI.done) + ' ' + tr(titleO);
    $('wImg').src = url; $('wFact').textContent = tr(factO);
    $('win').classList.add('on');
    try { const u = new SpeechSynthesisUtterance(tr(factO).replace('ﷺ', '')); u.lang = { en: 'en-US', ar: 'ar-SA', id: 'id-ID', tl: 'fil-PH' }[LANG]; speechSynthesis.speak(u); } catch (e) {}
  }, 500);
  parent.postMessage({ type: 'ilmstation:done', score: nStars, total: 3 }, '*');
}
function texts() {
  document.documentElement.lang = LANG; document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr';
  $('title').textContent = `🧩 ${tr(pack.name)}: ${tr(titleO)}`;
  $('sub').textContent = tr(UI.hint);
  $('lvl').textContent = `⭐ ${tr(UI.level)} ${lvIdx + 1}`;
  $('peekBtn').textContent = tr(UI.peek); $('mixBtn').textContent = tr(UI.mix); $('again').textContent = tr(UI.again);
}
$('peek').style.backgroundImage = `url("${url}")`;
$('peekBtn').onclick = () => { $('peek').classList.add('on'); setTimeout(() => $('peek').classList.remove('on'), 1500); };
$('mixBtn').onclick = () => { if (solved) return; shuffle(); moves = 0; $('moves').textContent = '👆 0'; place(); };
$('again').onclick = () => { $('win').classList.remove('on'); solved = false; moves = 0; $('moves').textContent = '👆 0'; shuffle(); place(); };
addEventListener('message', e => { const d = e.data || {}; if (d.type === 'ilmstation:welcome' && d.lang) { LANG = String(d.lang).slice(0, 2); if (!UI.hint[LANG]) LANG = 'en'; texts(); } });
if (!UI.hint[LANG]) LANG = 'en';
shuffle(); build(); texts();
try { parent.postMessage({ type: 'ilmstation:hello' }, '*'); } catch (e) {}
})();
